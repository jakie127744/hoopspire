# Builds and deploys Hoopspire to Cloudflare on every push to main.
#
# Before this workflow, nothing deployed automatically: a push to GitHub sat
# there until someone ran `wrangler deploy` by hand. That gap is exactly how
# five fixed commits — the ESPN scoreboard fix among them — went unpublished
# for hours while the live site kept showing empty scoreboards.
#
# `npm run build` already runs the crawler-file guard (scripts/check-crawler-
# files.mjs), so a build that would ship a broken ads.txt fails here before
# it ever reaches wrangler deploy.

name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# A deploy that starts while an earlier one is still running can race it —
# whichever finishes last wins, which might not be the newest commit. Queue
# instead, and drop a superseded run rather than letting it finish afterwards.
concurrency:
  group: deploy
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # TEMPORARY: reads the token from a secret named HOOPSPIRE rather than
      # the conventional CLOUDFLARE_API_TOKEN, because GitHub rate-limited
      # further token changes for one night. Rename the secret to
      # CLOUDFLARE_API_TOKEN when that clears, and switch the line below back
      # — GitHub secrets can't be renamed in place, only replaced.
      #
      # accountId is omitted rather than hex a secret for it tonight too: a
      # token scoped to one account lets wrangler resolve the account on its
      # own. Add CLOUDFLARE_ACCOUNT_ID and this input back if that ever stops
      # working — a Cloudflare account ID is not sensitive (it's visible in
      # the dashboard's own URL), so it does not need to be a secret at all.
      # wranglerVersion is pinned because the action's own default installed
      # Wrangler 3.90.0, which cannot read this project's config at all — a
      # combined `main` (Worker) with `assets` and D1/rate-limit bindings
      # needs Wrangler 4. 3.x failed immediately with "Missing entry-point",
      # unable to see `main` in wrangler.jsonc.
      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.HOOPSPIRE }}
          wranglerVersion: '4'
          command: deploy
