<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Hoopspire">
  <!--
    The header mark: a ball dropped through the rim.

    Drawn rather than cropped out of the badge, for three reasons. It has to
    read at 32px, where the badge is an unreadable blob. It has to sit on
    cream (#f3efe7) without a white plate or a drop shadow behind it. And it
    has to be in the site's own palette — ink and gold — instead of importing
    a navy-and-orange scheme that shares no hue with anything else on the page.

    Colours are literal rather than `currentColor`: the header loads this
    through an <img>, and an external SVG referenced that way resolves
    `currentColor` against itself, not the page — it would silently render
    black instead of ink. Inline it as a component if it ever needs to follow
    surrounding text.
  -->

  <!-- Net: two crossing sets of strands, drawn first so the rim caps them. -->
  <g stroke="#c89e56" stroke-width="1" fill="none" opacity="0.75" stroke-linecap="round">
    <path d="M8.4 22.2 L11 28.4" />
    <path d="M12.5 22.9 L14 28.9" />
    <path d="M19.5 22.9 L18 28.9" />
    <path d="M23.6 22.2 L21 28.4" />
    <path d="M9.6 25 L22.4 25" opacity="0.6" />
    <path d="M10.8 27.6 L21.2 27.6" opacity="0.45" />
  </g>

  <!-- Ball, sitting in the rim. -->
  <g>
    <circle cx="16" cy="13" r="8" fill="#1a1a1a" />
    <!-- Seams, cut in the background colour so they read at small sizes. -->
    <g stroke="#f3efe7" stroke-width="1.1" fill="none" stroke-linecap="round">
      <path d="M16 5 L16 21" />
      <path d="M8.2 13 L23.8 13" />
      <path d="M10.3 7.3 Q16 13 10.3 18.7" />
      <path d="M21.7 7.3 Q16 13 21.7 18.7" />
    </g>
  </g>

  <!-- Rim, over the ball so the ball reads as passing through it. -->
  <ellipse cx="16" cy="21.4" rx="8.4" ry="2.5" fill="none" stroke="#c89e56" stroke-width="1.9" />
</svg>
